export_data:
  name: Export Abstractor Data
  description: Exports the current state and mapping of all abstract sensors to a backup file.
import_data:
  name: Import Abstractor Data
  description: Imports the state and mapping of all abstract sensors from a backup file.
  fields:
    data:
      name: Snapshot
      description: Snapshot object previously produced by the export operation.
      required: true
      selector:
        object:
delete_sensor:
  name: Delete Abstract Sensor
  description: Deletes an Abstract sensor subentry, its entity, and its device.
  fields:
    subentry_id:
      name: Subentry ID
      description: ID of the sensor subentry (also listed as entry_id per entry in export snapshots).
      selector:
        text:
    legacy_unique_id:
      name: Legacy unique ID
      description: Alternative — the sensor's unique_id as shown in the entity registry. Provide either this or subentry_id, not both.
      selector:
        text:
