export_data:
  name: Export Abstractor Data
  description: Exports the current state and mapping of all abstract sensors to a backup file.
import_data:
  name: Import Abstractor Data
  description: Imports the state and mapping of all abstract sensors from a backup file.
  fields:
    data:
      name: Snapshot
      description: Snapshot object previously produced by the export operation.
      required: true
      selector:
        object:
delete_sensor:
  name: Delete Abstract Sensor
  description: Deletes an Abstract sensor subentry, its entity, and its device.
  fields:
    subentry_id:
      name: Subentry ID
      description: ID of the sensor subentry (also listed as entry_id per entry in export snapshots).
      selector:
        text:
    legacy_unique_id:
      name: Legacy unique ID
      description: Alternative — the sensor's unique_id as shown in the entity registry. Provide either this or subentry_id, not both.
      selector:
        text:

export_csv:
  name: Export Abstractor Values (CSV)
  description: Writes the current abstracted sensor values as a UTF-8 CSV file into the integration export directory.
  fields:
    basename:
      name: Basename
      description: Optional name stem for the CSV file; the timestamp suffix is always appended.
      required: false
      selector:
        text:
import_csv:
  name: Import Abstractor Values (CSV)
  description: Applies abstracted values from a CSV file in the export directory (xor content) to matching live sensors.
  fields:
    filename:
      name: File
      description: Plain file name inside the integration export directory. Provide either this or content.
      required: false
      selector:
        text:
    content:
      name: CSV content
      description: Raw CSV text in the abstractor values format. Provide either this or filename.
      required: false
      selector:
        text:
summary:
  name: Summarize Abstractor Sensors
  description: Reports per-sensor value aggregates (min/max/avg over a bounded window), counters and health in a stable contract.
  fields:
    window_days:
      name: Window (days)
      description: Aggregation window in days (1-7).
      required: false
      selector:
        number:
          min: 1
          max: 7