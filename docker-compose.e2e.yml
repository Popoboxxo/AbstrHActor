# =============================================================================
# Abstractor — E2E test stack (docker-compose.e2e.yml)
#
# Brings up a real Home Assistant instance (demo platform + hass-virtual
# controllable sensors) plus a Playwright test runner that drives it
# through an actual browser. Unlike docker-compose.test.yml (fast unit
# tests, no HA instance), this exercises the real Config Flow, Options
# Flow, sensor pipeline and sidebar panel end to end.
#
# Usage:
#   bash docker/setup-demo.sh                       # fetch hass-virtual once
#   rm -r docker/ha_config_e2e/.storage             # see warning below
#   docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.e2e.yml down -v
#
# IMPORTANT: `down -v` does NOT reset HA's onboarding/device state between
# runs. docker/ha_config_e2e/ is a host bind mount (not a named Docker
# volume), so `-v` — which only removes anonymous/named volumes — has no
# effect on it; HA's .storage/ directory (config entries, entity registry,
# onboarding flag, ...) persists on the host across every `down`/`up` cycle.
# Tests that assume a truly fresh instance (scripts/e2e_bootstrap.py's
# onboarding flow, unique-device-count assertions) will accumulate stale
# devices and become flaky/fail without an explicit
# `rm -r docker/ha_config_e2e/.storage` before each intended-to-be-fresh run.
# =============================================================================

name: abstractor-e2e

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      # Deliberately NOT docker/ha_config/ (docker-compose.demo.yml) — that
      # instance is meant for manual poking and accumulates onboarding state
      # (once onboarding is done, HA's /api/onboarding/* routes 404, which
      # breaks scripts/e2e_bootstrap.py's fresh-instance assumption). E2E
      # gets its own config dir instead — but it's still a host bind mount,
      # not disposable on its own; see the `down -v` warning above.
      - ./docker/ha_config_e2e:/config
      - ./custom_components/abstractor:/config/custom_components/abstractor:ro
    environment:
      - TZ=Europe/Berlin
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8123')"]
      interval: 5s
      timeout: 5s
      retries: 30

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      homeassistant:
        condition: service_healthy
    environment:
      - HASS_BASE_URL=http://homeassistant:8123
    volumes:
      - ./test-results:/workspace/test-results
