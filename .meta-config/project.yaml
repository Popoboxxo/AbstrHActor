dod-preset: rapid-prototyping
dod:
  tests-required: true
project:
  name: AbstrHActor
  prefix: Absrct
  short: AbstrHActor
variables:
  PLATFORM: Home Assistant
  PROJECT_DESCRIPTION: 'A Home Assistant integration that abstracts physical devices
    (sensors, actuators) behind a unified interface. Implements hardware/software
    decoupling so that the concrete sensor hardware (e.g., Zendure, Shelly, Tasmota)
    can be swapped without changing automation logic, dashboards, or utility meters.

    '
  RUNTIME: Python 3.12+
  LANGUAGE: Python
  PROJECT_LANGUAGES: Python
  SYSTEM_DEPENDENCIES: '- homeassistant >= 2025.1 - aiohttp (HA internal) - pyserial
    (for serial/UART sensors) - paho-mqtt (for MQTT sensor bridge)

    '
  PROJECT_STRUCTURE: "# Root\nhacs.json                  # HACS manifest (name, homeassistant\
    \ version, etc.)\ncustom_components/abstractor/\n  __init__.py          # async_setup_entry,\
    \ async_unload_entry\n  manifest.json        # HA manifest (domain, version, requirements,\
    \ iot_class)\n  const.py             # DOMAIN, CONF_*, SENSOR_TYPES enum\n  config_flow.py\
    \       # ConfigFlow with unique ID, discovery steps\n  coordinator.py       #\
    \ DataUpdateCoordinator — central polling\n  diagnostics.py       # Diagnostics\
    \ support\n  filters.py           # Value filters (spike filter, monotonic guard)\n\
    \  frontend.py          # Frontend integration entry point\n  influx_exporter.py\
    \   # InfluxDB exporter\n  sensor.py            # Sensor platform — CoordinatorEntity\
    \ + EntityDescription\n  snapshot.py          # Snapshot support\n  services.yaml\
    \        # Service definitions\n  strings.json         # Config flow translations\
    \ (i18n)\n  icons.json           # Entity icon translations (mdi icons)\n  repository/\n\
    \    device_registry.py # Device registry (Repository pattern)\n  brand/\n   \
    \ icon.png           # Brand icon for HACS UI (256x256)\n    logo.png        \
    \   # Brand logo (optional)\n  translations/        # Translation catalogs\n \
    \ www/                 # Frontend static assets\n  # PLANNED / roadmap (do not\
    \ exist yet):\n  bridge/              # AbstractBridge protocol + serial/mqtt/http\
    \ bridges\n  sensor_types/        # SensorType enum + EntityDescription registry\n\
    tests/                 # 14 test files (root-level)\n  __init__.py\n  conftest.py\
    \          # Pytest fixtures (mock HA, mock bridges)\n  test_config_flow.py  #\
    \ Config flow tests (required: 100% coverage)\n  test_coordinator.py\n  test_diagnostics.py\n\
    \  test_filters.py\n  test_frontend.py\n  test_influx_exporter.py\n  test_lifecycle.py\n\
    \  test_migration.py\n  test_reconciliation.py\n  test_sensor.py\n  test_services.py\n\
    \  test_snapshot.py\ndocs/\n  ARCHITECTURE.md      # High-level architecture docs\n\
    \  SENSOR_TYPES.md      # Supported sensor types and their interfaces\n.github/\n\
    \  workflows/\n    validate.yaml      # HACS Action + Hassfest validation on push/PR"
  ENTRY_POINT_PATTERN: custom_components/abstractor/__init__.py
  KEY_PATTERNS: "- **Bridge Pattern**: Separates hardware communication (serial, MQTT,\
    \ HTTP)\n  from the sensor abstraction. Each bridge implementation translates\
    \ between\n  raw hardware protocols and a unified `AbstractSensor` interface.\n\
    - **Strategy Pattern**: Each sensor type (temperature, power, water, etc.)\n \
    \ implements a common `AbstractSensor` base class, allowing polymorphic\n  sensor\
    \ access from automations and dashboards.\n- **Repository Pattern**: A central\
    \ `DeviceRegistry` manages all discovered\n  devices, handles deduplication, and\
    \ provides lookup by device ID, type,\n  or location.\n- **Adapter Pattern (HA\
    \ native)**: Leverages Home Assistant's own entity\n  registry to expose abstract\
    \ sensors as first-class HA entities with\n  proper device_class, state_class,\
    \ and unit_of_measurement.\n- **DataUpdateCoordinator (HA)**: Central polling\
    \ coordinator shared by all\n  entities. Single `_async_update_data` call fetches\
    \ all device data once,\n  then dispatches to entities via CoordinatorEntity.\
    \ Avoids N parallel polls.\n- **EntityDescription (declarative)**: Sensor types\
    \ defined as dataclass\n  lists with `key`, `value_fn`, `device_class`, `state_class`,\
    \ etc. No\n  repetitive boilerplate per entity.\n- **Config Flow with Unique ID**:\
    \ Every config entry has a stable unique_id\n  (serial/MAC, never IP). Supports\
    \ discovery (USB, DHCP, MQTT) and reauth.\n- **Spike Filter / Monotonic Guard**:\
    \ Energy and water sensors include\n  monotonically-increasing guards to prevent\
    \ counter resets from corrupting\n  utility meter totals — battle-proven from\
    \ production HA deployment.\n- **HACS Delivery**: GitHub releases with semantic\
    \ versioning. `hacs.json`\n  with min HA version. `brand/` directory with icon.\
    \ GitHub Actions for\n  HACS Action + Hassfest validation on every push/PR.\n"
  BUILD_COMMAND: pip install -e . && python3 -m script.hassfest --integration-path
    custom_components/abstractor
  BUILD_COMMANDS: pip install -e . && python3 -m script.hassfest
  DEV_COMMANDS: '# Run tests

    pytest tests/ -v

    # Run linter

    ruff check .

    # Run type checker

    mypy custom_components/

    # Build

    pip install -e . && python3 -m script.hassfest --integration-path custom_components/abstractor'
  TEST_COMMAND: pytest tests/ -v --cov=custom_components/abstractor --cov-report=term-missing
  TEST_COMMANDS: pytest tests/ -v --cov=custom_components/abstractor --cov-report=term-missing
  DEV_STACK_START: '# Start Home Assistant dev instance with custom component linked
    hass -c config/ --debug # Or via Docker with volume mount: # docker compose -f
    config/docker-compose.yml up -d

    '
  DOCKER_STACKS_OVERVIEW: '- config/docker-compose.yml: Home Assistant dev instance
    + optional addons

    - external/: submodules for skills and tools'
  DEV_STACK_RELOAD: '# Reload custom_component without full restart: # Option A: Core
    UI → Developer Tools → YAML → "Reload custom components" # Option B: HA CLI ha
    core restart # Option C: Docker compose docker compose -f config/docker-compose.yml
    restart # Option D: Touch reload flag (HA Core dev mode) touch config/.HA_RELOAD  #
    triggers core config reload

    '
  CODE_CONVENTIONS: '- PEP 8, Ruff formatting, type hints everywhere (PEP 604 syntax)
    - Google-style docstrings for all public classes/methods - Async-first: all bridge
    I/O uses asyncio (aiohttp, asyncio serial) - has_entity_name = True (HA mandatory
    for new integrations) - Entity names: only the data point (e.g., "Power usage"),
    never include device name - Sensor types as EntityDescription dataclass lists
    (declarative, no boilerplate) - DataUpdateCoordinator for central polling (never
    per-entity polling) - ConfigFlow with stable unique_id (serial/MAC, never IP)
    - No `from x import *` — explicit imports only - All sensor values validated before
    exposure (NaN, None, unavailable) - Logging: _LOGGER.debug for non-user-facing,
    _LOGGER.error for failures - Log formatting: use %s style (not f-strings) for
    _LOGGER calls - f-strings everywhere else (never % or str.format) - Config flow
    needs 100% test coverage

    '
  DEVELOPER_SNIPPETS_PATH: ''
  EXTRA_DONTS: '- Do not use deprecated HA patterns (legacy entity platforms without
    EntityDescription)

    - Do not use `async_add_entities` without coordinator

    - Do not hardcode device IDs or IPs in sensor logic

    - Do not commit .agent-meta/ changes directly (use submodule workflow)'
  SE_MAX_DEPTH: 5
  SE_MAX_PARALLEL_CELLS: 3
  ARCHITECTURE: "custom_components/abstractor/\n  __init__.py          # async_setup_entry,\
    \ async_unload_entry\n  manifest.json        # HA manifest (domain, version, requirements,\
    \ iot_class)\n  const.py             # DOMAIN, CONF_*\n  config_flow.py      \
    \ # ConfigFlow with unique ID, discovery steps\n  coordinator.py       # DataUpdateCoordinator\
    \ — central polling\n  diagnostics.py       # Diagnostics support\n  filters.py\
    \           # Spike filter / monotonic guard\n  frontend.py          # Frontend\
    \ integration\n  influx_exporter.py   # InfluxDB exporter\n  sensor.py       \
    \     # Sensor platform (CoordinatorEntity + EntityDescription)\n  snapshot.py\
    \          # Snapshot support\n  repository/\n    device_registry.py # DeviceRegistry\
    \ (Repository pattern)\n  brand/               # HACS brand assets\n  translations/\
    \        # Translation catalogs\n  www/                 # Frontend static assets\n\
    \  # PLANNED / roadmap (do not exist yet):\n  bridge/              # AbstractBridge\
    \ protocol + serial/mqtt/http implementations\n  sensor_types/        # SensorType\
    \ enum + per-type implementations\ntests/                 # 14 test files (root-level)"
  REQ_CATEGORIES: '- Core features: device discovery, sensor polling, config flow
    - Bridge implementations: serial, MQTT, HTTP - Sensor types: temperature, humidity,
    pressure, power, water - Non-functional: async performance, memory safety, HA
    core compliance

    '
  PROJECT_GOAL: 'Build a production-grade Home Assistant custom_component that decouples
    hardware sensor protocols from HA automations via a clean Bridge+Strategy architecture.
    The integration shall support pluggable bridge backends (serial, MQTT, HTTP) and
    a growing set of sensor types — allowing users to swap hardware without touching
    their YAML automations or dashboards. Delivered via HACS with full GitHub release
    workflow, CI validation (HACS Action + Hassfest), and brand assets. Follows all
    HA core conventions: DataUpdateCoordinator, has_entity_name, EntityDescription,
    ConfigFlow with unique IDs, and 100% test coverage for config flow.

    '
  PROJECT_CONTEXT: 'The user runs a mixed Home Assistant environment with Zigbee (Z2M),
    Tasmota, Shelly, Zendure, and custom serial sensors. Current abstraction uses
    YAML template sensors — this integration will replace those with a proper Python
    custom_component, adding type safety, testability, and HA-native entity management.

    '
  COMMUNICATION_LANGUAGE: English
  USER_INPUT_LANGUAGE: English
  DOCS_LANGUAGE: English
  INTERNAL_DOCS_LANGUAGE: English
  CODE_LANGUAGE: English
  AGENT_META_REPO: Popoboxxo/agent-meta
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/Popoboxxo/AbstrHActor
  GIT_MAIN_BRANCH: main
  DELIVERY_MECHANISM: 'Distributed via HACS (Home Assistant Community Store) as a
    custom repository. Published on GitHub with semantic versioning tags/releases.
    HACS requirements met: - hacs.json with `name`, `homeassistant` min version -
    brand/ directory with icon.png (256x256) and logo.png - GitHub Actions: HACS Action
    + Hassfest validation - GitHub Issues enabled, repository description and topics
    set - One integration per repo (single custom_components/<domain>/ subdir) - Release-based
    delivery (GitHub Releases with proper semver tags) - My Home Assistant link (my.home-assistant.io)
    in README for easy add - Optional: submit to hacs/default for default repository
    listing

    '
  HACS_MIN_HA_VERSION: 2025.1.0
  HACS_CATEGORY: integration
orchestrator:
  enabled: true
  provider-overrides:
    Claude:
      mode: main-chat
  handoff:
    protocol: none
knowledge-engine:
  okf:
    enforce-frontmatter: true
    allowed-types:
    - Concept
    - Architecture
    - API Reference
    - Guide
    - Session Conclusion
    auto-index: true
    auto-log: true
  operations:
    ingest:
      auto-cross-reference: true
      auto-index-update: true
      batch-mode: true
    query:
      file-back-results: true
    lint:
      schedule: post-ingest
      checks:
      - broken-links
      - missing-frontmatter
      - stale-index
      - orphaned-pages
      - duplicate-concepts
  migration:
    auto-detect-sources: true
    clean-duplicates: false
    preserve-originals: true
  search:
    engine: index-only
    mcp-server: ''
  domain: internal-docs
  bundle-path: knowledge
  sources-dir: sources
  wiki-dir: wiki
  schema-language: auto
  enabled: true
rules-preset: ''
tier-preset: Normal
se-focus: false
quality-pipelines:
  overrides:
    se-cascade:
      enabled: false
    concept-development:
      enabled: false
    bugfix:
      enabled: false
    refactor:
      enabled: false
