  reqogniloom-requirements-architect:
    enabled: true
  reqogniloom-risk-analyst:
    enabled: true
  reqogniloom-test-engineer:
    enabled: true
  home-organization:
    enabled: false
  opengrid-openscad:
    enabled: false
skills-registry: {}
mcp-registry: {}
