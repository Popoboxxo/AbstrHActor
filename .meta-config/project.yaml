# agent-meta project.yaml — generated by --setup wizard
# Edit this file to customize variables and settings.
# Then run: py .agent-meta/scripts/sync.py

agent-meta-version: 0.89.0
ai-providers:
- Claude
- Gemini
- Opencode
roles:
- orchestrator
- agent-meta-manager
- developer
- documenter
- meta-feedback
- log-analyzer
- git
dod-preset: standard
project:
  name: AbstrHActor
  prefix: Absrct
  short: AbstrHActor
variables:
  PROJECT_CONTEXT: AbstrHActor — short description.
  PROJECT_GOAL: Primary goal of AbstrHActor.
  PROJECT_LANGUAGES: TypeScript
  COMMUNICATION_LANGUAGE: English
  USER_INPUT_LANGUAGE: English
  DOCS_LANGUAGE: English
  INTERNAL_DOCS_LANGUAGE: English
  CODE_LANGUAGE: English
  AGENT_META_REPO: Popoboxxo/agent-meta
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/Popoboxxo/AbstrHActor
  GIT_MAIN_BRANCH: main
  DEV_COMMANDS: bun run build
  TEST_COMMANDS: bun test
  BUILD_COMMANDS: bun run build
  CODE_CONVENTIONS: '- TypeScript ES6+, no `any`, no `var`'
  ARCHITECTURE: 'src/\n  index.ts  # Entry-Point'
  REQ_CATEGORIES: '- Core features\n- Non-functional requirements'
