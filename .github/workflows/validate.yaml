name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  translations-sync:
    name: Translations in sync with strings.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare strings.json and translations/en.json
        run: |
          python3 -c "
          import json, sys
          with open('custom_components/abstractor/strings.json') as f:
              source = json.load(f)
          with open('custom_components/abstractor/translations/en.json') as f:
              translated = json.load(f)
          # 'title' is deliberately excluded: custom integrations take their
          # display name from manifest.json's 'name', not strings.json's
          # top-level title, so it's never mirrored into translations/en.json.
          for key in set(source) - {'title'}:
              if source.get(key) != translated.get(key):
                  print(f'MISMATCH in {key!r} block between strings.json and translations/en.json')
                  sys.exit(1)
          print('strings.json and translations/en.json are in sync.')
          "

  pytest:
    name: Pytest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_test.txt
      - name: Run pytest
        run: pytest tests/ -v --cov=custom_components/abstractor --cov-report=term-missing
